spring.application.name=sprint-boot-custom-authentication
spring.datasource.url=jdbc:mariadb://localhost:3306/auth_service_db
spring.datasource.username=admin
spring.datasource.password=admin
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
app.otp.length=6
app.otp.ttl=5m
app.otp.max-attempts=5
app.otp.secret=dev-only-change-me-to-a-long-random-string
spring.web.error.include-stacktrace=never
spring.web.error.include-message=always
spring.web.error.include-binding-errors=always